name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Package manifest check
        run: npm pack --dry-run --json >/tmp/pack.json && cat /tmp/pack.json
